---
# example-app.yaml — smoke-test the full stack
# Deploy a simple echo server and expose it via HTTPRoute
# Access: https://echo.local.test (add to /etc/hosts first)

apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: demo
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
---
# HTTPRoute — routes echo.local.test → echo service
# HTTPS is handled by the wildcard cert on the Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: demo
spec:
  parentRefs:
    - name: local-gateway
      namespace: envoy-gateway-system
  hostnames:
    - 'echo.local.test'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 80
---
# Redirect HTTP → HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-redirect
  namespace: demo
spec:
  parentRefs:
    - name: local-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - 'echo.local.test'
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
